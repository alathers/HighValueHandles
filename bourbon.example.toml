# bourbon-process configuration (generated by `bourbon-process config template`).
#
# Files read, lowest precedence first:
#   ${XDG_CONFIG_HOME:-~/.config}/bourbon-process/config.toml
#   ./bourbon.toml (current directory only)
# --config PATH (or $BOURBON_CONFIG) reads only that file; --no-config (or
# BOURBON_NO_CONFIG=1) reads none. Environment variables override files and
# command-line flags override both. Relative paths are relative to this file.
# Unknown keys are errors. API keys never go here: set BRAVE_API_KEY or
# OLLAMA_API_KEY in the environment.

[input]
# Folder containing the photos to process. (env BOURBON_IMAGE_FOLDER; flag -f/--image-folder)
image_folder = "."

[output]
# Output directory for processed bottles. (env BOURBON_OUTPUT_DIR; flag -o/--output-dir)
output_dir = "processed"

[processing]
# Bottles per batch (an integer >= 1, or "all"). (env BOURBON_BATCH_SIZE; flag -b/--batch-size)
batch_size = 5
# Bottle groups analysed in parallel (1-10); results are merged in input order. 1 is strictly sequential (use it for evaluation runs). (env BOURBON_CONCURRENCY; flag --concurrency)
concurrency = 2
# Review every bottle interactively before saving. (env BOURBON_INTERACTIVE; flag -i/--interactive)
interactive = false
# Hints TOML file with per-bottle reading notes and sourced field values ("" = none). (env BOURBON_HINTS_FILE; flag --hints)
hints_file = ""

[grouping]
# Most seconds between consecutive photos of one bottle (EXIF capture time). (env BOURBON_GROUP_GAP_SECONDS; flag --group-gap-seconds)
gap_seconds = 12.0
# Most photos per bottle; longer runs are split at their largest gap (0 = no limit). (env BOURBON_GROUP_MAX_SIZE; flag --group-max-size)
max_group_size = 3
# Extra split-check analyses per group over the run (0 turns the check off). (env BOURBON_SPLIT_BUDGET_RATIO; flag --split-budget-ratio)
split_budget_ratio = 0.35

[model]
# Ollama vision model tag that reads the label (must be vision-capable). (env BOURBON_MODEL; flag -m/--model)
vision_model = "qwen3.6:35b-a3b"
# Download missing models after a disk-space check (never implicit). (env BOURBON_PULL; flag --pull/--no-pull)
pull = false
# GiB to keep free on the Ollama model store after a pull. (env BOURBON_MIN_FREE_GB; flag --min-free-gb)
min_free_gb = 5.0
# Keep the vision and text models loaded together instead of unloading between phases. (env BOURBON_KEEP_MODELS_LOADED; flag --keep-models-loaded/--no-keep-models-loaded)
keep_models_loaded = false

[text]
# Run the text-model fact check over OCR and web evidence. (env BOURBON_VERIFY; flag --verify/--no-verify)
enabled = true
# Ollama text model for the fact check ("none" disables the stage). (env BOURBON_TEXT_MODEL; flag --text-model)
model = "gpt-oss:120b"
# Reasoning effort of the fact-check extraction call (low, medium, high). (env BOURBON_TEXT_THINK; flag --text-think)
think_extract = "high"
# Reasoning effort of the description-writing call (low, medium, high). (config file only)
think_compose = "medium"
# Read timeout of one text-model call, in seconds. (env BOURBON_TEXT_TIMEOUT; flag --text-timeout)
timeout_seconds = 900.0
# Context window (tokens) of text-model calls (4096-131072). (config file only)
num_ctx = 32768

[server]
# Ollama service URL. (env BOURBON_OLLAMA_URL; flag -u/--ollama-url)
ollama_url = "http://localhost:11434"
# Start a local Ollama server if none is running. (env BOURBON_SERVER_AUTOSTART; flag --server-autostart/--no-server-autostart)
autostart = true
# Leave a server started by this run running afterwards. (env BOURBON_KEEP_SERVER; flag --keep-server/--no-keep-server)
keep_running = false
# Seconds to wait for a server this run starts. (env BOURBON_SERVER_START_TIMEOUT; flag --server-start-timeout)
start_timeout = 30.0
# Per-request vision timeout in seconds (covers a cold model load). (env BOURBON_REQUEST_TIMEOUT; flag --request-timeout)
request_timeout = 600.0

[retry]
# Repeat model requests that fail in a way that may pass (unusable output, timeouts, 5xx). (env BOURBON_RETRY; flag -r/--allow-retry, --no-retry)
enabled = true
# Attempts per model request when retry is on (1-5). (env BOURBON_RETRY_ATTEMPTS; flag --retry-attempts)
max_attempts = 3
# Seconds before the second attempt (doubles each time, with jitter). (config file only)
initial_delay_seconds = 2.0
# Longest wait between attempts, in seconds. (config file only)
max_delay_seconds = 30.0

[web]
# Look bottles up on the web (search, fetch, cite). (env BOURBON_WEB; flag --web/--no-web)
enabled = true
# Search provider: auto (Brave key, Ollama key, SearXNG URL, else DuckDuckGo), duckduckgo, brave, ollama, searxng or none. (env BOURBON_WEB_PROVIDER; flag --web-provider)
provider = "auto"
# Base URL of a self-hosted SearXNG instance ("" = none). (env BOURBON_SEARXNG_URL)
searxng_url = ""
# Fetch a vendor reference image per bottle (implies web lookups). (env BOURBON_INCLUDE_VENDOR_IMAGES; flag -v/--include-vendor-images)
vendor_images = false
# Search queries per bottle. (config file only)
max_queries = 2
# Search results kept per query. (config file only)
max_results = 8
# Pages fetched per bottle. (config file only)
max_pages = 5
# Fetched pages passed to the fact check per bottle. (config file only)
max_llm_pages = 4
# Timeout of one page fetch, in seconds. (config file only)
fetch_timeout_seconds = 15.0
# Largest page body read, in bytes. (config file only)
max_page_bytes = 2000000
# Largest vendor image read, in bytes. (config file only)
max_image_bytes = 5000000
# Least seconds between two requests to one host. (config file only)
per_host_interval_seconds = 2.0
# Most web requests in one run (searches and fetches). (config file only)
max_requests_per_run = 500
# Hours a fetched page is reused from the cache (0 = never). (config file only)
cache_ttl_hours = 168
# Hours a search result list is reused from the cache (0 = never). (config file only)
search_cache_ttl_hours = 24
# Domains never fetched or cited (subdomains included). (config file only)
deny_domains = []
# If not empty, only these domains are fetched or cited (strict mode). (config file only)
allow_domains = []
# Web cache directory ("" = ${XDG_CACHE_HOME:-~/.cache}/bourbon-process/web). (env BOURBON_WEB_CACHE_DIR; flag --web-cache-dir)
cache_dir = ""

[logging]
# Debug logging. (env BOURBON_DEBUG; flag --debug)
debug = false
